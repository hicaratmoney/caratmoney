<script>
  /* Runs before anything else: a returning visitor on / who chose Hindi/Marathi/Kannada
     gets /hi, /mr or /kn (before GA records the page view); sets <html lang> early. */
  (function () {
    try {
      var L = { '/hi': 'hi', '/mr': 'mr', '/kn': 'kn' };
      var p = location.pathname.replace(/\/+$/, '') || '/';
      var l = L[p];
      if (!l && p === '/') {
        var s = null; try { s = localStorage.getItem('cm_lang'); } catch (e) {}
        if (s === 'hi' || s === 'mr' || s === 'kn') { l = s; history.replaceState(history.state, '', '/' + s + location.search + location.hash); }
      }
      if (l) document.documentElement.lang = l;
    } catch (e) {}
  })();
</script>
